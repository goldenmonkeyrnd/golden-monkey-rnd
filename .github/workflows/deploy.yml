name: Check and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.160.1'
          extended: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:browser
      - run: bun scripts/build-proof.ts write "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: portfolio-build
          path: public/
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.0
        with:
          name: portfolio-build
          path: public/
      - name: Deploy the exact checked artifact
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Website main changed before deployment.' >&2; exit 1; }
          bun scripts/build-proof.ts verify "$GITHUB_SHA"
          bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
