name: Promote qualified Sentinels release
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [promote, rollback]
        required: true
      sentinels_tag:
        type: string
      sentinels_release_id:
        type: string
      sentinels_source_sha:
        type: string
      sentinels_qualification_sha256:
        type: string
      rollback_archive_sha256:
        description: Retained archive digest to restore
        type: string
      rollback_reason:
        description: Why the replaced release must remain blocked
        type: string
permissions:
  contents: read
concurrency:
  group: portfolio-main
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.160.1'
          extended: true
      - run: bun install --frozen-lockfile
      - name: Verify qualified release or prepare explicit rollback
        run: |
          echo "SITE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          bun scripts/promote-sentinels.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTINELS_OPERATION: ${{ inputs.operation }}
          SENTINELS_TAG: ${{ inputs.sentinels_tag }}
          SENTINELS_RELEASE_ID: ${{ inputs.sentinels_release_id }}
          SENTINELS_SOURCE_SHA: ${{ inputs.sentinels_source_sha }}
          SENTINELS_QUALIFICATION_SHA256: ${{ inputs.sentinels_qualification_sha256 }}
          SENTINELS_ROLLBACK_ARCHIVE: ${{ inputs.rollback_archive_sha256 }}
          SENTINELS_ROLLBACK_REASON: ${{ inputs.rollback_reason }}
      - name: Commit candidate locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sentinels-release.json data/sentinels-catalog.json data/sentinels-policy.json
          if test -d data/sentinels-provenance; then git add data/sentinels-provenance/; fi
          if ! git diff --cached --quiet; then git commit -m 'Update verified Sentinels release pin'; fi
          echo "SITE_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify the exact candidate tree
        run: |
          bun run build
          bun run check
          bunx playwright install --with-deps chromium
          bun run check:browser
          bun scripts/build-proof.ts write "$SITE_CANDIDATE_SHA"
          bun scripts/build-proof.ts verify "$SITE_CANDIDATE_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: qualified-portfolio-${{ github.run_id }}
          path: public/
      - name: Publish pin with a fast-forward lease
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$SITE_BASE_SHA" || { echo 'Website main changed during qualification; refusing to overwrite it.' >&2; exit 1; }
          git push origin HEAD:refs/heads/main
      - name: Deploy the checked artifact without rebuilding
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$SITE_CANDIDATE_SHA" || { echo 'Website main changed before deployment.' >&2; exit 1; }
          bun scripts/build-proof.ts verify "$SITE_CANDIDATE_SHA"
          bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
