[tools]
bun = "1.3.4"

[tasks.dev]
run = "bun run dev"

[tasks.post]
description = "Create a blog draft: mise run post -- my-post-title"
usage = 'arg "<slug>" help="Post name using lowercase words separated by hyphens"'
run = 'hugo new content --kind blog "blog/${usage_slug?}/index.md"'

[tasks.build]
run = "bun run build"

[tasks.check]
run = "bun run check"

[tasks.deploy]
run = "bun run deploy"
